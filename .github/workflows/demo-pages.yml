name: 发布交互演示

on:
  push:
    branches: [main]
    paths:
      - 'remote/**'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: 验证网页与演示逻辑
        working-directory: remote
        run: node --test
      - name: 构建独立静态演示
        working-directory: remote
        run: npm run build:demo
      - uses: actions/upload-pages-artifact@v4
        with:
          path: remote/.demo-dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
