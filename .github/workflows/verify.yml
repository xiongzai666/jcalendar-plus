name: 验证 J-Calendar Plus

on:
  push:
  pull_request:

jobs:
  compiled-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装固定版本的云端构建工具
        run: |
          npm ci --prefix remote
          npm install --prefix "$RUNNER_TEMP/edgeone-cli" edgeone@1.6.41
      - name: 编译并验证隔离云端包
        env:
          HTTP_PROXY: ''
          HTTPS_PROXY: ''
        run: |
          export EDGEONE_CLI_ENTRY="$RUNNER_TEMP/edgeone-cli/node_modules/edgeone/edgeone-bin/edgeone.js"
          npm run build:candidate --prefix remote
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [z15, z21, z98, "1680"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装验证依赖
        run: |
          pip install platformio==6.2.0
          npm ci --prefix remote
      - name: 验证网页、云端、固件及 C++ 策略
        run: python tools/verify.py --environment ${{ matrix.environment }}
