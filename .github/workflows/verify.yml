name: Verify J-Calendar

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [z15, z21, z98, "1680"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verification dependencies
        run: |
          pip install platformio==6.2.0
          npm ci --prefix remote
      - name: Verify phone, cloud, firmware and all C++ policies
        run: python tools/verify.py --environment ${{ matrix.environment }}
