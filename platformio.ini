; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = Ink Screen Calendar
default_envs = 
	z21
	z15
	z98
	1680

[common]
framework = arduino
lib_deps = 
;	zinggjm/GxEPD2@^1.6.0
	olikraus/U8g2_for_Adafruit_GFX@1.8.0
	bblanchon/ArduinoJson@7.4.3
	tzapu/WiFiManager@2.0.17
	mathertel/OneButton@2.6.2
	https://github.com/JADE-Jerry/nongli.git#b14baf1f7d2a5643e27d783a95a4ae7d93873488
	https://github.com/tignioj/ArduinoUZlib#20aff95cd80c141f80bdbf66895409a0046d2c2f
	https://github.com/Wh1teRabbitHU/RX8010SJ#fa9d6a9d37230abe4406d5ece60c18d5473e81f7

[env:1680]
build_type = release
platform = espressif32@7.1.3
board = esp32dev
framework = ${common.framework}
lib_deps = ${common.lib_deps}
upload_speed = 921600
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags = -D SI_DRIVER=1680

[env:z98]
build_type = release
platform = espressif32@7.1.3
board = esp32dev
framework = ${common.framework}
lib_deps = ${common.lib_deps}
upload_speed = 460800
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags = -D SI_DRIVER=98

[env:z21]
build_type = release
platform = espressif32@7.1.3
board = esp32dev
framework = ${common.framework}
lib_deps = ${common.lib_deps}
upload_speed = 460800
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags = -D SI_DRIVER=21

[env:z15]
build_type = release
platform = espressif32@7.1.3
board = esp32dev
framework = ${common.framework}
lib_deps = ${common.lib_deps}
upload_speed = 460800
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_flags = -D SI_DRIVER=15

